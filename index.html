<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .chest {
            font-size: 80px;
            cursor: pointer;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid transparent;
            border-radius: 15px;
            transition: 0.1s;
            width: 120px;
        }
        
        .gold-flash {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd700;
            background-color: #fff9c4;
        }
        
        button {
            margin: 10px;
            padding: 12px 25px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        #status {
            margin: 20px;
            font-size: 20px;
            color: #333;
        }
        
        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #9E9E9E !important;
        }
        
        #result {
            font-size: 24px;
            margin-top: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎁 Выберите сундук:</h2>
        <button onclick="selectChest('wood')">📦 Сундук (25 кликов)</button>
        <button disabled class="disabled">🔒 Железный сундук</button>
        <button onclick="selectChest('pass')">💎 ПАСС СУНДУК (50 кликов)</button>
        
        <div class="chest" id="chest" onclick="clickChest()" style="display: none;">📦</div>
        
        <div id="status"></div>
        <div id="result"></div>
    </div>

    <script>
        let selectedChest = null;
        let clickCount = 0;
        let requiredClicks = 0;

        function selectChest(type) {
            selectedChest = type;
            clickCount = 0;
            const chest = document.getElementById('chest');
            chest.style.display = 'block';
            chest.textContent = '📦'; 
            
            requiredClicks = type === 'wood' ? 25 : 50;
            updateStatus();
            document.getElementById('result').innerHTML = '';
        }

        function clickChest() {
            if(!selectedChest) return;
            
            const chest = document.getElementById('chest');
            chest.classList.add('gold-flash');
            setTimeout(() => chest.classList.remove('gold-flash'), 100);
            
            // Анимация нажатия
            chest.style.transform = 'scale(0.95)';
            setTimeout(() => chest.style.transform = 'scale(1)', 100);
            
            clickCount++;
            updateStatus();
            
            if(clickCount >= requiredClicks) {
                openChest();
            }
        }

        function updateStatus() {
            document.getElementById('status').textContent = 
                `🔨 Прогресс: ${clickCount}/${requiredClicks}`;
        }

        function openChest() {
            let reward = '';
            const random = Math.random() * 100;
            
            if(selectedChest === 'wood') {
                if(random <= 40) {
                    reward = '400 💎';
                } else if(random <= 65) {
                    reward = '800 💎';
                } else if(random <= 70) {
                    reward = '💯 +100 опыта';
                } else {
                    reward = '600 💎'; // Вместо "ничего"
                }
            } 
            else if(selectedChest === 'pass') {
                if(random <= 50) {
                    reward = '1250 💎';
                } else if(random <= 85) {
                    reward = '2000 💎';
                } else if(random <= 86) {
                    reward = '💎 1250 + 💯 1000 опыта';
                } else {
                    reward = '600 💎'; // Вместо "ничего"
                }
            }
            
            document.getElementById('result').innerHTML = `
                <h3>🎉 Вы получили:</h3>
                <p style="color: #2e7d32; font-weight: bold;">${reward}</p>
            `;
            
            // Сброс и анимация
            selectedChest = null;
            clickCount = 0;
            const chest = document.getElementById('chest');
            chest.style.display = 'none';
            document.getElementById('status').textContent = '';
        }
    </script>
</body>
</html>
